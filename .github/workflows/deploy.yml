name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Assemble standalone release
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          tar -C .next/standalone -czf outboundos-release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outboundos-${{ github.sha }}
          path: outboundos-release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: outboundos-${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          SSH_HOST: ${{ vars.PRODUCTION_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_USER }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          scp \
            -P "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            outboundos-release.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/outboundos-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          SSH_HOST: ${{ vars.PRODUCTION_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_USER }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
          APP_DIR: ${{ vars.PRODUCTION_APP_DIR || '/srv/outboundos' }}
          APP_PORT: ${{ vars.PRODUCTION_APP_PORT || '3000' }}
        run: |
          printf -v remote_command \
            'bash -s -- %q %q %q %q' \
            "$APP_DIR" \
            "$GITHUB_SHA" \
            "/tmp/outboundos-${GITHUB_SHA}.tar.gz" \
            "$APP_PORT"

          ssh \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" \
            < ops/deploy-remote.sh
